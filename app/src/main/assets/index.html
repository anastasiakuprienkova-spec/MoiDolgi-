<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a32"><title>Мои долги</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5fa;color:#171a32;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 16px 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 12px}.muted{color:#7b8194}.hero{background:linear-gradient(120deg,#242b62,#8057b7);color:white;padding:24px;border-radius:24px;box-shadow:0 12px 25px #33336622}.hero .amount{font-size:36px;font-weight:800;margin:6px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats div{background:#ffffff20;padding:12px;border-radius:14px}.stats strong{display:block;font-size:19px;margin-top:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;gap:12px}button{cursor:pointer;border:0;border-radius:13px;padding:12px 16px;font:inherit;font-weight:650;background:#dedff1;color:#25294e}button.primary{background:#6356d8;color:white}button.danger{background:#ffe9eb;color:#a52b45}button.small{padding:8px 11px;font-size:13px}.debt{background:white;padding:19px;border-radius:19px;margin:12px 0;box-shadow:0 4px 18px #2020400b}.top{display:flex;justify-content:space-between;gap:8px;align-items:start}.top h3{font-size:18px;margin:0 0 4px}.chip{font-size:12px;padding:5px 9px;border-radius:20px;background:#f0ecff;color:#6356c5;white-space:nowrap}.progress{height:9px;border-radius:20px;background:#ececf3;overflow:hidden;margin:15px 0 8px}.progress span{display:block;height:100%;background:#7963df;border-radius:20px}.debt .numbers{display:flex;justify-content:space-between;gap:8px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.empty{background:white;border-radius:18px;padding:32px;text-align:center;color:#72778a}.overlay{position:fixed;inset:0;background:#11152b88;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal{width:min(100%,470px);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:22px}.modal h2{margin-bottom:18px}label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9dbe6;border-radius:12px;font:inherit;background:white;color:#20243c}textarea{resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.history{padding-left:18px}.history li{margin:12px 0}.foot{margin-top:24px;font-size:12px;color:#85899a;line-height:1.5}.hidden{display:none}.right{text-align:right} .filter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filter button.active{background:#252b60;color:white}</style></head><body><main class="wrap"><header><div><h1>Мои долги</h1><div class="muted">Учёт погашений без таблиц</div></div><div style="display:flex;gap:6px"><button class="small" onclick="importData()">Импорт</button><button class="small" onclick="exportData()">Экспорт</button></div></header><section class="hero"><div>Осталось погасить</div><div class="amount" id="remaining">0 ₽</div><div class="stats"><div>Изначально<strong id="total">0 ₽</strong></div><div>Погашено<strong id="paid">0 ₽</strong></div></div></section><div class="toolbar"><h2>Задолженности</h2><button class="primary" onclick="openAdd()">+ Добавить</button></div><div class="filter"><button class="small active" data-filter="all" onclick="setFilter('all')">Все</button><button class="small" data-filter="mine" onclick="setFilter('mine')">Я должна</button><button class="small" data-filter="theirs" onclick="setFilter('theirs')">Мне должны</button></div><div id="list"></div><div class="foot">Данные сохраняются только в этом браузере на этом устройстве. Для резервной копии используйте «Экспорт». При очистке данных браузера записи могут исчезнуть.</div></main><div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><script>
const KEY='debt_tracker_v1';let debts=[];let filter='all';try{debts=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(debts))debts=[]}catch{debts=[]}const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n)+' ₽';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sumPaid=d=>(d.payments||[]).reduce((s,p)=>s+Number(p.amount),0);const balance=d=>Math.max(0,Number(d.amount)-sumPaid(d));function save(){localStorage.setItem(KEY,JSON.stringify(debts));render()}function setFilter(v){filter=v;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===v));render()}function render(){let selected=debts.filter(d=>filter==='all'||d.type===filter);let active=selected.filter(d=>balance(d)>0);document.getElementById('remaining').textContent=money(active.reduce((s,d)=>s+balance(d),0));document.getElementById('total').textContent=money(selected.reduce((s,d)=>s+Number(d.amount),0));document.getElementById('paid').textContent=money(selected.reduce((s,d)=>s+sumPaid(d),0));document.getElementById('list').innerHTML=selected.length?selected.map(d=>{let p=sumPaid(d),b=balance(d),pct=Math.min(100,100*p/d.amount);return `<article class="debt"><div class="top"><div><h3>${esc(d.name)}</h3><div class="muted">${esc(d.note||'Без описания')}</div></div><span class="chip">${b===0?'Погашен':d.type==='mine'?'Я должна':'Мне должны'}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="numbers"><div>Погашено: <b>${money(p)}</b></div><div class="right">Осталось: <b>${money(b)}</b></div></div><div class="actions">${b>0?`<button class="primary small" onclick="openPay('${d.id}')">+ Платёж</button>`:''}<button class="small" onclick="openHistory('${d.id}')">История (${(d.payments||[]).length})</button><button class="small" onclick="openEdit('${d.id}')">Изменить</button></div></article>`}).join(''):'<div class="empty">Пока нет долгов. Добавьте первую запись.</div>'}function show(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){document.getElementById('overlay').classList.add('hidden')}function fields(d={}){return `<form id="debtForm"><label>Кто должен?</label><select name="type"><option value="mine" ${d.type==='mine'?'selected':''}>Я должна</option><option value="theirs" ${d.type==='theirs'?'selected':''}>Мне должны</option></select><label>Имя или название долга</label><input name="name" maxlength="100" required placeholder="Например, кредит или Анна" value="${esc(d.name||'')}"><label>Общая сумма, ₽</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="50000" value="${d.amount||''}"><label>Комментарий (необязательно)</label><textarea name="note" rows="2" maxlength="500" placeholder="За что долг">${esc(d.note||'')}</textarea><div class="modalactions"><button type="button" onclick="closeModal()">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form>`}function openAdd(){show('<h2>Новый долг</h2>'+fields());document.getElementById('debtForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return alert('Введите корректную сумму');debts.push({id:crypto.randomUUID(),type:f.get('type'),name:f.get('name').trim(),amount,note:f.get('note').trim(),payments:[]});save();closeModal()}}function openEdit(id){let d=debts.find(x=>x.id===id);if(!d)return;show('<h2>Изменить долг</h2>'+fields(d)+`<button class="danger small" onclick="removeDebt('${id}')">Удалить долг</button>`);document.getElementById('debtForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0||amount+0.000001<sumPaid(d))return alert('Сумма долга не может быть меньше уже погашенной');Object.assign(d,{type:f.get('type'),name:f.get('name').trim(),amount,note:f.get('note').trim()});save();closeModal()}}function removeDebt(id){if(confirm('Удалить долг вместе со всей историей платежей?')){debts=debts.filter(d=>d.id!==id);save();closeModal()}}function openPay(id){let d=debts.find(x=>x.id===id);if(!d)return;show(`<h2>Добавить платёж</h2><div class="muted">${esc(d.name)} · осталось ${money(balance(d))}</div><form id="payForm"><label>Сумма, ₽</label><input type="number" name="amount" min="0.01" max="${balance(d)}" step="0.01" required><label>Дата платежа</label><input type="date" name="date" required value="${new Date().toLocaleDateString('en-CA')}"><label>Комментарий</label><input name="note" maxlength="200" placeholder="Необязательно"><div class="modalactions"><button type="button" onclick="closeModal()">Отмена</button><button class="primary" type="submit">Записать</button></div></form>`);document.getElementById('payForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),a=Number(f.get('amount'));if(!Number.isFinite(a)||a<=0||a>balance(d)+0.000001)return alert('Сумма должна быть больше нуля и не превышать остаток');d.payments.push({id:crypto.randomUUID(),amount:a,date:f.get('date'),note:f.get('note').trim()});save();closeModal()}}function openHistory(id){let d=debts.find(x=>x.id===id);if(!d)return;show(`<h2>История: ${esc(d.name)}</h2><div class="muted">Всего ${money(d.amount)} · погашено ${money(sumPaid(d))}</div>${d.payments.length?'<ol class="history">'+[...d.payments].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<li><b>${money(p.amount)}</b> · ${esc(p.date)}<div class="muted">${esc(p.note)}</div><button class="danger small" onclick="deletePay('${id}','${p.id}')">Удалить платёж</button></li>`).join('')+'</ol>':'<p>Платежей пока нет.</p>'}<div class="modalactions"><button onclick="closeModal()">Закрыть</button></div>`)}function deletePay(id,pid){if(!confirm('Удалить этот платёж?'))return;let d=debts.find(x=>x.id===id);d.payments=d.payments.filter(p=>p.id!==pid);save();openHistory(id)}function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{let obj=JSON.parse(await input.files[0].text());let items=Array.isArray(obj)?obj:obj.debts;if(!Array.isArray(items)||!items.every(d=>d&&typeof d.name==='string'&&['mine','theirs'].includes(d.type)&&Number.isFinite(Number(d.amount))&&Number(d.amount)>0&&Array.isArray(d.payments)&&d.payments.every(p=>Number.isFinite(Number(p.amount))&&Number(p.amount)>0)))throw Error('Неверный формат файла');if(!confirm('Заменить все текущие долги данными из резервной копии?'))return;debts=items;save();alert('Данные восстановлены')}catch(e){alert('Не удалось импортировать файл: '+e.message)}};input.click()}function exportData(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),debts},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moi-dolgi-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();</script></body></html>
